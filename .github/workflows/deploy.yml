name: Deploy Natya Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: mashina-official.ru
          port: 22
          username: root
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            cd /opt/stacks/natya-site
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull --ff-only origin main
            fi
            docker compose up -d --build
