name: Deploy Natya Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: External HTTPS check
        run: |
          curl -4 -sS -o /dev/null --connect-timeout 20 --max-time 30 \
            -w 'external_https status=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' \
            https://mashina-official.ru/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: mashina-official.ru
          port: 22
          username: root
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            if [ -d /srv/mashina-site/.git ]; then
              DEPLOY_DIR=/srv/mashina-site
            elif [ -d /opt/stacks/natya-site/.git ]; then
              DEPLOY_DIR=/opt/stacks/natya-site
            else
              DEPLOY_DIR=/srv/mashina-site
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi

            git config --global --add safe.directory "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git pull --ff-only origin main
            npm ci
            npm run build

            mkdir -p /var/www/mashina-official.ru
            cp -a dist/. /var/www/mashina-official.ru/

            test -f /etc/nastya-contact.env
            chmod 600 /etc/nastya-contact.env

            NODE_BIN="$(command -v node)"
            printf '%s\n' \
              '[Unit]' \
              'Description=Nastya site Telegram contact form' \
              'After=network-online.target' \
              'Wants=network-online.target' \
              '' \
              '[Service]' \
              'Type=simple' \
              'EnvironmentFile=/etc/nastya-contact.env' \
              "WorkingDirectory=$DEPLOY_DIR" \
              "ExecStart=$NODE_BIN $DEPLOY_DIR/server/contact-service.mjs" \
              'Restart=on-failure' \
              'RestartSec=3' \
              'User=www-data' \
              'Group=www-data' \
              'NoNewPrivileges=true' \
              'PrivateTmp=true' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > /etc/systemd/system/nastya-contact.service

            mkdir -p /etc/nginx/snippets
            printf '%s\n' \
              'location = /api/contact {' \
              '    proxy_pass http://127.0.0.1:3100;' \
              '    proxy_http_version 1.1;' \
              '    proxy_set_header Host $host;' \
              '    proxy_set_header X-Real-IP $remote_addr;' \
              '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '    proxy_connect_timeout 5s;' \
              '    proxy_read_timeout 15s;' \
              '    client_max_body_size 32k;' \
              '}' \
              > /etc/nginx/snippets/nastya-contact-api.conf

            NGINX_SITE="$(grep -RIl 'server_name[^;]*mashina-official\.ru' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n1)"
            test -n "$NGINX_SITE"
            if ! grep -q 'nastya-contact-api.conf' "$NGINX_SITE"; then
              sed -i '/server_name[^;]*mashina-official\.ru/a\    include /etc/nginx/snippets/nastya-contact-api.conf;' "$NGINX_SITE"
            fi

            nginx -t
            systemctl daemon-reload
            systemctl enable --now nastya-contact
            systemctl restart nastya-contact
            systemctl reload nginx

            sleep 2
            if ! systemctl is-active --quiet nastya-contact; then
              systemctl --no-pager --full status nastya-contact || true
              journalctl -u nastya-contact -n 50 --no-pager || true
              exit 1
            fi

            curl -fsS http://127.0.0.1:3100/health
            curl -sk --resolve mashina-official.ru:443:127.0.0.1 \
              -o /dev/null \
              -w 'local_https status=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' \
              https://mashina-official.ru/
            systemctl --no-pager --full status nastya-contact | head -n 20

      - name: Verify Telegram contact delivery
        if: contains(github.event.head_commit.message, '[contact-test]')
        run: |
          curl -4 -sS --fail-with-body --connect-timeout 20 --max-time 30 \
            -X POST https://mashina-official.ru/api/contact \
            -H 'Content-Type: application/json' \
            --data '{"name":"Проверка сайта","email":"test@mashina-official.ru","message":"Тестовая заявка после настройки Telegram-бота. Если вы видите это сообщение, форма работает."}'
