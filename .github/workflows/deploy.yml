name: Deploy Natya Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: mashina-official.ru
          port: 22
          username: root
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            if [ -d /srv/mashina-site/.git ]; then
              DEPLOY_DIR=/srv/mashina-site
            elif [ -d /opt/stacks/natya-site/.git ]; then
              DEPLOY_DIR=/opt/stacks/natya-site
            else
              DEPLOY_DIR=/srv/mashina-site
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi

            git config --global --add safe.directory "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git pull --ff-only origin main
            docker compose up -d --build

            if [ -d /var/www/mashina-official.ru ]; then
              docker cp natya-site-web:/usr/share/nginx/html/. /var/www/mashina-official.ru/
            fi
